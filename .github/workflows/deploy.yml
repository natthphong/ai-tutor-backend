name: Verify backend
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toko
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: toko_loop_test
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U toko' --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race -timeout 120s ./...
        env:
          TEST_DATABASE_URL: postgres://toko:test-only@localhost:5432/toko_loop_test?sslmode=disable
      - run: go vet ./...
